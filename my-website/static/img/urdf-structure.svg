<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" text-anchor="middle" fill="#2c3e50">URDF Robot Structure</text>

  <!-- Robot Base Link -->
  <rect x="220" y="150" width="160" height="80" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="10"/>
  <text x="300" y="195" font-family="Arial" font-size="14" text-anchor="middle" fill="white">base_link</text>

  <!-- Wheel Links -->
  <circle cx="250" cy="280" r="30" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="250" y="285" font-family="Arial" font-size="12" text-anchor="middle" fill="white">wheel_1</text>

  <circle cx="350" cy="280" r="30" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="350" y="285" font-family="Arial" font-size="12" text-anchor="middle" fill="white">wheel_2</text>

  <!-- Joint Connections -->
  <line x1="270" y1="230" x2="250" y2="250" stroke="#95a5a6" stroke-width="3"/>
  <line x1="330" y1="230" x2="350" y2="250" stroke="#95a5a6" stroke-width="3"/>

  <!-- Joint Labels -->
  <text x="240" y="240" font-family="Arial" font-size="12" fill="#7f8c8d">joint_1</text>
  <text x="350" y="240" font-family="Arial" font-size="12" fill="#7f8c8d">joint_2</text>

  <!-- Sensor Mount -->
  <rect x="300" y="80" width="60" height="40" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="5"/>
  <text x="330" y="105" font-family="Arial" font-size="10" text-anchor="middle" fill="white">sensor</text>

  <!-- Sensor Joint -->
  <line x1="330" y1="150" x2="330" y2="120" stroke="#95a5a6" stroke-width="3"/>

  <!-- Labels -->
  <text x="300" y="340" font-family="Arial" font-size="14" text-anchor="middle" fill="#2c3e50">Links (rigid bodies) connected by Joints</text>

  <!-- Legend -->
  <rect x="20" y="330" width="180" height="50" fill="white" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="110" y="350" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">Blue: Base Link</text>
  <text x="110" y="365" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">Green: Wheel Links</text>
</svg>