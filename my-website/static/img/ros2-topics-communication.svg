<svg width="700" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="350" y="30" font-family="Arial" font-size="20" text-anchor="middle" fill="#2c3e50">ROS 2 Topics Communication</text>

  <!-- Publisher Node -->
  <rect x="50" y="80" width="120" height="60" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="10"/>
  <text x="110" y="115" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Publisher</text>

  <!-- Topic Bus -->
  <rect x="250" y="90" width="200" height="40" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="5"/>
  <text x="350" y="115" font-family="Arial" font-size="14" text-anchor="middle" fill="white">/sensor_data</text>

  <!-- Subscriber Node 1 -->
  <rect x="500" y="60" width="120" height="60" fill="#2ecc71" stroke="#27ae60" stroke-width="2" rx="10"/>
  <text x="560" y="95" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Subscriber 1</text>

  <!-- Subscriber Node 2 -->
  <rect x="500" y="140" width="120" height="60" fill="#2ecc71" stroke="#27ae60" stroke-width="2" rx="10"/>
  <text x="560" y="175" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Subscriber 2</text>

  <!-- Arrows for communication -->
  <line x1="170" y1="110" x2="250" y2="110" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="80" x2="500" y2="90" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="130" x2="500" y2="160" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#95a5a6" />
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="20" y="220" width="200" height="60" fill="white" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="120" y="240" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">Publisher sends messages</text>
  <text x="120" y="255" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">to topic, subscribers</text>
  <text x="120" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">receive copies</text>
</svg>