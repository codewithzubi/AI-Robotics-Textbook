<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" text-anchor="middle" fill="#2c3e50">ROS 2 Architecture</text>

  <!-- DDS Middleware -->
  <rect x="150" y="100" width="300" height="80" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="10"/>
  <text x="300" y="145" font-family="Arial" font-size="16" text-anchor="middle" fill="white">DDS Middleware</text>

  <!-- Node 1 -->
  <circle cx="100" cy="250" r="40" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="100" y="255" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Node A</text>

  <!-- Node 2 -->
  <circle cx="300" cy="250" r="40" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="300" y="255" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Node B</text>

  <!-- Node 3 -->
  <circle cx="500" cy="250" r="40" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="500" y="255" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Node C</text>

  <!-- Communication arrows -->
  <line x1="135" y1="225" x2="265" y2="140" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="335" y1="140" x2="465" y2="225" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#95a5a6" />
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="20" y="330" width="160" height="50" fill="white" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="100" y="350" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">Nodes communicate</text>
  <text x="100" y="365" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">through DDS</text>
</svg>